apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-jwks
  labels:
    app.kubernetes.io/name: jwks
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jwks
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jwks
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: jwks
          mountPath: /usr/share/nginx/html/.well-known
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /.well-known/jwks.json
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 10
      volumes:
      - name: jwks
        configMap:
          name: {{ .Release.Name }}-jwks
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-jwks
  labels:
    app.kubernetes.io/name: jwks
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: jwks
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: http
    port: 80
    targetPort: 80
