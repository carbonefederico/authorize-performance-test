# secrets.yaml — lab credentials the scripts inject via --set-string.
# .env holds the source values; this template renders them into cluster
# Secrets so the Ping products and the load generator read one shared value.
# Never commit rendered output; values flow from the git-ignored .env.
apiVersion: v1
kind: Secret
metadata:
  name: paz-secrets
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  sideband-shared-secret: {{ .Values.sidebandSharedSecret | quote }}
  pap-admin-password: {{ .Values.papAdminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: paz-devops-secret
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  username: {{ .Values.devopsUser | quote }}
  password: {{ .Values.devopsKey | quote }}
