{{- if .Values.pap.ingress.enabled }}
# TLS for the PAP ingress, issued by the cluster's letsencrypt-pdo issuer
# (same pattern as the sibling agentgateway-stack's certificates.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-pap-tls
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  secretName: {{ .Release.Name }}-pap-tls
  issuerRef:
    name: {{ .Values.pap.ingress.clusterIssuer }}
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.pap.ingress.publicHost }}
{{- end }}
